[package]
name = "laptop-sensor-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.9.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }

