<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- /etc/dbus-1/system.d/org.sbchild.LaptopSensorDaemon.conf -->

  <policy user="root">
    <allow own="org.sbchild.LaptopSensorDaemon"/>
    <allow send_destination="org.sbchild.LaptopSensorDaemon"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.sbchild.LaptopSensorDaemon"/>
    <allow receive_sender="org.sbchild.LaptopSensorDaemon"/>
  </policy>
</busconfig>